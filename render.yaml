services:
  - type: web
    name: cardpilot
    runtime: node
    plan: starter
    region: virginia
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: COLLECTION_STORAGE_MODE
        value: supabase
      - key: SECURE_COOKIES
        value: "true"
      - key: LOCAL_COLLECTION_IMPORT_ENABLED
        value: "false"
      - key: EBAY_MARKETPLACE_ID
        value: EBAY_US
      - key: SUPABASE_CARD_IMAGES_BUCKET
        value: card-images
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_FAST_MODEL
        value: gpt-5.4-mini
      - key: APP_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_VISION_ENABLED
        value: "false"
      - key: GOOGLE_CLOUD_PROJECT_ID
        sync: false
      - key: GOOGLE_CLOUD_CREDENTIALS_BASE64
        sync: false
      - key: GOOGLE_VISION_TIMEOUT_MS
        value: "3000"
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_SELL_ENVIRONMENT
        value: production
      - key: EBAY_SELL_CLIENT_ID
        sync: false
      - key: EBAY_SELL_CLIENT_SECRET
        sync: false
      - key: EBAY_REDIRECT_URI_NAME
        sync: false
      - key: EBAY_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: EBAY_SCHEDULER_SECRET
        sync: false
      - key: THE_CARD_API_KEY
        sync: false
      - key: THE_CARD_API_MONTHLY_COST_CENTS
        value: "0"
      - key: OPENAI_MONTHLY_COST_CENTS
        value: "0"
      - key: GOOGLE_VISION_MONTHLY_COST_CENTS
        value: "0"
      - key: EBAY_API_MONTHLY_COST_CENTS
        value: "0"
      - key: POKEMON_TCG_MONTHLY_COST_CENTS
        value: "0"
      - key: RENDER_MONTHLY_COST_CENTS
        value: "700"
      - key: SUPABASE_MONTHLY_COST_CENTS
        value: "0"
      - key: POKEMON_TCG_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
