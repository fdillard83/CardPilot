name: eBay scheduled publishing

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  publish-due-auctions:
    runs-on: ubuntu-latest
    steps:
      - name: Wake CardPilot and publish due schedules
        env:
          SCHEDULER_SECRET: ${{ secrets.EBAY_SCHEDULER_SECRET }}
        run: |
          test -n "$SCHEDULER_SECRET"
          curl --fail-with-body --retry 3 --retry-delay 10 \
            --request POST \
            --header "Authorization: Bearer $SCHEDULER_SECRET" \
            https://cardpilot-aizd.onrender.com/api/internal/ebay/run-schedules
